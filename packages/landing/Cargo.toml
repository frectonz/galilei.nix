[package]
name = "landing"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
procfs = { version = "0.18.0", default-features = false }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
rustix = { version = "1.1.5", features = ["fs"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
topcoat = { version = "0.11.0", features = ["icon-iconify"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[build-dependencies]
topcoat = { version = "0.11.0", default-features = false, features = ["icon-iconify"] }
